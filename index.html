<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>EmulatorJS</title>
        <link rel="icon" href="docs/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
        <meta name="viewport" content="width = device-width, initial-scale = 1">
        <style>
             body, html {
                height: 100%;
                background-color: black;
                color: white;
            }

            body {
                margin: 0;
                overflow-x: hidden;
                overflow-y: auto;
                padding: 10px 0;
                box-sizing: border-box;
            }

            body, #box, #top {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }

            #box {
                color: #aaa;
                height: 20em;
                width: 30em;
                max-width: 80%;
                max-height: 80%;
                background-color: #333;
                border-radius: 0.4em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;
                transition-duration: 0.2s;
                overflow: hidden;
                font-family: monospace;
                font-weight: bold;
                font-size: 20px;
                margin: 5px;
                text-align: center;
                padding: 10px;
            }

            #box:hover, #box[drag] {
                border-color: #1AAFFF;
                color: #ddd
            }

            #library {
                color: #aaa;
                width: 30em;
                max-width: 80%;
                background-color: #333;
                border-radius: 0.4em;
                border: 2px solid #555;
                position: relative;
                font-family: monospace;
                font-weight: bold;
                font-size: 16px;
                margin: 5px;
                padding: 12px;
                box-sizing: border-box;
            }

            #libraryTitle {
                font-size: 16px;
                color: #ddd;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
            }

            #librarySearch {
                width: 100%;
                padding: 6px 10px;
                box-sizing: border-box;
                background-color: #222;
                border: 1px solid #555;
                border-radius: 0.4em;
                color: #eee;
                font-family: monospace;
                font-size: 14px;
                margin-bottom: 8px;
            }

            #librarySearch:focus {
                outline: none;
                border-color: #1AAFFF;
            }

            #libraryList {
                max-height: 180px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .libraryItem {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 6px 10px;
                background-color: #262626;
                border: 1px solid #444;
                border-radius: 0.3em;
                transition: 0.15s;
            }

            .libraryItem:hover {
                border-color: #1AAFFF;
                background-color: #2f2f2f;
            }

            .libraryItemText {
                display: flex;
                flex-direction: column;
                text-align: left;
                overflow: hidden;
                margin-right: 8px;
            }

            .libraryItemName {
                color: #fff;
                font-size: 14px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .libraryItemSystem {
                color: #888;
                font-size: 11px;
                font-weight: normal;
            }

            .libraryPlayBtn {
                width: auto;
                margin: 0;
                padding: 4px 12px;
                font-size: 12px;
                background-color: #1AAFFF;
                color: #fff;
                border: none;
                border-radius: 0.3em;
                cursor: pointer;
                font-weight: bold;
                white-space: nowrap;
            }

            .libraryPlayBtn:hover {
                background-color: #0088dd;
            }

            .libraryEmpty {
                color: #777;
                font-size: 13px;
                text-align: center;
                padding: 15px 0;
            }

            #advanced {
                color: #aaa;
                text-align: left;
                width: 30em;
                max-width: 80%;
                background-color: #333;
                border-radius: 0.4em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;
                transition-duration: 0.2s;
                overflow: hidden;
                font-family: monospace;
                font-weight: bold;
                font-size: 20px;
                margin: 5px;
                padding: 10px;
            }

            #advancedOptionsBox {
                margin-top: 10px;
                font-size: 14px;
                margin-left: 20px;
            }

            .advancedOptionsBoxRow {
                margin-top: 10px;
            }

            #input {
                cursor: pointer;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
            }

            #display {
                width: 100%;
                height: 100%
            }

            select, button {
                padding: 0.6em 0.4em;
                margin: 0.5em;
                width: 15em;
                max-width: 100%;
                font-family: monospace;
                font-weight: bold;
                font-size: 16px;
                background-color: #444;
                color: #aaa;
                border-radius: 0.4em;
                border: 1px solid #555;
                cursor: pointer;
                transition-duration: 0.2s
            }

            select:hover, button:hover {
                background-color: #666;
                color: #ddd
            }

            .logo {
                width: 130px;
                height: 130px;
                filter: drop-shadow(0 0 8px white);
            }

            #top {
                margin: 5px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            #navTabs {
                display: flex;
                gap: 8px;
                width: 30em;
                max-width: 80%;
                margin: 15px 0 10px 0;
            }

            .navTab {
                flex: 1;
                padding: 10px 14px;
                background-color: #262626;
                border: 2px solid #444;
                border-radius: 0.4em;
                color: #888;
                cursor: pointer;
                text-align: center;
                font-size: 14px;
                font-family: monospace;
                font-weight: bold;
                transition: 0.15s;
                margin: 0;
                width: auto;
            }

            .navTab:hover {
                background-color: #333;
                color: #ddd;
                border-color: #666;
            }

            .navTab.active {
                background-color: #333;
                color: #fff;
                border-color: #1AAFFF;
                box-shadow: 0 0 10px rgba(26, 175, 255, 0.25);
            }
        </style>
    </head>

    <body>
        <div id="top">
            <h1>EmulatorJS Demo</h1>
            <img src="docs/Logo-light.png" alt="Logo" class="logo">
            <div id="navTabs">
                <button type="button" class="navTab active" id="tabLibrary">Games Library</button>
                <button type="button" class="navTab" id="tabUpload">Upload ROM</button>
                <button type="button" class="navTab" id="tabAdvanced">Options</button>
            </div>
        </div>
        <div id="library">
            <div id="libraryTitle">
                <span>Built-in Library <span id="libraryCount">(0)</span></span>
                <span style="font-size: 11px; color: #888; font-weight: normal;">games.json</span>
            </div>
            <input type="text" id="librarySearch" placeholder="Search built-in games..." />
            <div id="libraryList">
                <div class="libraryEmpty">Loading games from games.json...</div>
            </div>
        </div>
        <div id="box" style="display: none;">
            <input type="file" id ="input" title="Upload" />
            Drag ROM file or click here
        </div>
        <div id="advanced" style="display: none;">
            <div id="advancedToggleBox">
                <input type="checkbox" id="advancedToggle" />
                <label for="advancedToggle"> Show Advanced Options</label>
            </div>
            <div id="advancedOptionsBox">
                <div class="advancedOptionsBoxRow">
                    <input type="file" id ="inputAdvanced" title="BIOS" />
                    <label for="inputAdvanced"> Upload BIOS file (if required)</label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <input type="checkbox" id="debugToggle" />
                    <label for="debugToggle"> Enable Debug Mode</label>
                </div>
                <div id="advancedOptionsBoxThreads" class="advancedOptionsBoxRow">
                    <input type="checkbox" id="threadsToggle" />
                    <label for="threadsToggle"> Enable Threads</label>
                </div>
                <div id="advancedOptionsCache" class="advancedOptionsBoxRow">
                    <input type="checkbox" id="cacheToggle" checked="checked" />
                    <label for="cacheToggle"> Enable Cache</label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <span>Browser mode: </span>
                    <input type="radio" id="browserModeAuto" name="browserMode" value="auto">
                    <label for="browserModeAuto"> Auto </label>
                    <input type="radio" id="browserModeDesktop" name="browserMode" value="desktop">
                    <label for="browserModeDesktop"> Desktop </label>
                    <input type="radio" id="browserModeMobile" name="browserMode" value="mobile">
                    <label for="browserModeMobile"> Mobile </label>
                </div>
            </div>
        </div>

        <script>
            let enableDebug = false;
            let enableThreads = false;
            let browserMode;

            const biosFileInput = document.getElementById("inputAdvanced");
            
            const advancedToggle = document.getElementById("advancedToggle");
            const advanced = document.getElementById("advanced");
            const advancedOptionsBox = document.getElementById("advancedOptionsBox");
            advancedOptionsBox.style.display = "none";
            advancedToggle.addEventListener("change", (event) => {
                if (event.target.checked) {
                    advancedOptionsBox.style.display = "block";
                } else {
                    advancedOptionsBox.style.display = "none";
                }
            });

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const debugToggle = document.getElementById("debugToggle");
            debugToggle.addEventListener("change", (event) => {
                enableDebug = event.target.checked;
                console.log(`Debug is ${enableDebug ? "enabled" : "disabled"}`);
            });
            const cacheToggle = document.getElementById("cacheToggle");
            window.EJS_cacheConfig = {
                enabled: true,
                cacheMaxSizeMB: 4096, // 4096 MB = 4 GB
                cacheMaxAgeMins: 7200 // 7200 minutes = 5 days
            };
            cacheToggle.addEventListener("change", (event) => {
                const cacheEnabled = event.target.checked;
                console.log(`Cache is ${cacheEnabled ? "enabled" : "disabled"}`);
                window.EJS_cacheConfig.enabled = cacheEnabled;
            });
            const threadsToggleAvailable = document.getElementById("advancedOptionsBoxThreads");
            const threadsToggle = document.getElementById("threadsToggle");
            threadsToggle.addEventListener("change", (event) => {
                enableThreads = event.target.checked;
                console.log(`Threads are ${enableThreads ? "enabled" : "disabled"}`);
            });
            if (parseInt(urlParams.get("debug")) === 1 || urlParams.get("debug") === "true") {
                enableDebug = true;
                debugToggle.checked = true;
                console.log("Debug is enabled");
            } else {
                debugToggle.checked = false;
                console.log("Debug is disabled");
            }

            if (window.SharedArrayBuffer) {
                threadsToggleAvailable.style.display = "block";
                if (parseInt(urlParams.get("threads")) === 1 || urlParams.get("threads") === "true") {
                    enableThreads = true;
                    threadsToggle.checked = true;
                    console.log("Threads are enabled");
                } else {
                    threadsToggle.checked = false;
                    console.log("Threads are disabled");
                }
            } else {
                threadsToggleAvailable.style.display = "none";
                console.warn("Threads are disabled as SharedArrayBuffer is not available. Threads requires two headers to be set when sending you html page. See https://stackoverflow.com/a/68630724");
            }

            const browserModeAuto = document.getElementById("browserModeAuto");
            browserModeAuto.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = undefined;
                    console.log("Browser mode set to auto");
                }
            });
            const browserModeDesktop = document.getElementById("browserModeDesktop");
            browserModeDesktop.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = "desktop";
                    console.log("Browser mode set to desktop");
                }
            });
            const browserModeMobile = document.getElementById("browserModeMobile");
            browserModeMobile.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = "mobile";
                    console.log("Browser mode set to mobile");
                }
            });
            if (urlParams.get("browserMode")) {
                browserMode = urlParams.get("browserMode");
                switch (browserMode) {
                    case 1:
                    case "1":
                    case "mobile":
                        browserModeMobile.checked = true;
                        break;
                    case 2:
                    case "2":
                    case "desktop":
                        browserModeDesktop.checked = true;
                        break;
                    default:
                        browserModeAuto.checked = true;
                        break;
                }
            } else {
                browserModeAuto.checked = true;
            }

            if (urlParams.get("rom")) {
                console.log(`Loading ROM from URL: roms/${urlParams.get("rom")}`);
                run(false, urlParams.get("rom"));
            }

            async function run(upload, file) {
                const url = upload ? input.files[0] : `roms/${file}`;
                const parts = upload ? input.files[0].name.split(".") : file.split(".");

                const biosUrl = biosFileInput.files.length > 0 ? biosFileInput.files[0] : "";

                const core = await (async (ext) => {
                    if (["fds", "nes", "unif", "unf"].includes(ext))
                        return "nes"

                    if (["smc", "fig", "sfc", "gd3", "gd7", "dx2", "bsx", "swc"].includes(ext))
                        return "snes"

                    if (["z64", "n64"].includes(ext))
                        return "n64"

                    if (["pce"].includes(ext))
                        return "pce"

                    if (["ngp", "ngc"].includes(ext))
                        return "ngp"

                    if (["ws", "wsc"].includes(ext))
                        return "ws"

                    if (["col", "cv"].includes(ext))
                        return "coleco"

                    if (["d64"].includes(ext))
                        return "vice_x64sc"
                    
                    if (["md", "sg", "smd", "gen"].includes(ext))
                        return "segaMD"

                    if (["nds", "gba", "gb", "z64", "n64", "nes", "snes"].includes(ext))
                        return ext

                    if (["3ds", "cci", "cia", "cxi", "app"].includes(ext))
                        return "3ds"

                    return await new Promise(resolve => {
                        var coreValues = {
                            "Nintendo 64": "n64",
                            "Nintendo Game Boy": "gb",
                            "Nintendo Game Boy Advance": "gba",
                            "Nintendo DS": "nds",
                            "Nintendo Entertainment System": "nes",
                            "Super Nintendo Entertainment System": "snes",
                            "PlayStation": "psx",
                            "Virtual Boy": "vb",
                            "Sega Mega Drive": "segaMD",
                            "Sega Master System": "segaMS",
                            "Sega CD": "segaCD",
                            "Atari Lynx": "lynx",
                            "Sega 32X": "sega32x",
                            "Atari Jaguar": "jaguar",
                            "Sega Game Gear": "segaGG",
                            "Sega Saturn": "segaSaturn",
                            "Atari 7800": "atari7800",
                            "Atari 2600": "atari2600",
                            "Arcade": "arcade",
                            "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                            "NEC PC-FX": "pcfx",
                            "SNK NeoGeo Pocket (Color)": "ngp",
                            "Bandai WonderSwan (Color)": "ws",
                            "ColecoVision": "coleco",
                            "Commodore 64": "vice_x64sc",
                            "Commodore 128": "vice_x128",
                            "Commodore VIC20": "vice_xvic",
                            "Commodore Plus/4": "vice_xplus4",
                            "Commodore PET": "vice_xpet",
                            "Amiga": "puae"
                        }
                        
                        if (enableThreads) {
                            coreValues["DOSBOX-PURE"] = "dosbox_pure";
                            coreValues["PlayStation Portable"] = "ppsspp";
                            coreValues["Nintendo 3DS"] = "3ds";
                        }

                        for (let core in coreValues) {
                            if (core.toLowerCase() === ext || coreValues[core].toLowerCase() === ext) {
                                return resolve(coreValues[core])
                            }
                        }
 
                        const cores = Object.keys(coreValues).sort().reduce(
                            (obj, key) => { 
                                obj[key] = coreValues[key]; 
                                return obj;
                            }, 
                            {}
                        );

                        const button = document.createElement("button")
                        const select = document.createElement("select")

                        for (const type in cores) {
                            const option = document.createElement("option")

                            option.value = cores[type]
                            option.textContent = type
                            select.appendChild(option)
                        }

                        button.onclick = () => resolve(select[select.selectedIndex].value)
                        button.textContent = "Load game"
                        box.innerHTML = ""

                        box.appendChild(select)
                        box.appendChild(button)
                    })
                })(parts.pop())

                const div = document.createElement("div")
                const sub = document.createElement("div")
                const script = document.createElement("script")

                sub.id = "game"
                div.id = "display"

                const top = document.getElementById("top");
                if (top) top.remove();
                box.remove();
                div.appendChild(sub);
                advanced.remove();
                const library = document.getElementById("library");
                if (library) library.remove();
                document.body.appendChild(div);

                window.EJS_player = "#game";
                window.EJS_gameName = parts.shift();
                window.EJS_biosUrl = biosUrl;
                window.EJS_gameUrl = url;
                window.EJS_core = core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_threads = enableThreads;
                if (browserMode) {
                    window.EJS_browserMode = browserMode;
                }
                window.EJS_askBeforeExit = false;
                window.EJS_onExit = () => {
                        alert("The emulator has exited. This callback can be used to do any cleanup or show a message to the user.");
                    };

                script.src = "data/loader.js";
                document.body.appendChild(script);
            }

            async function launchLibraryGame(game) {
                const enableDebug = document.getElementById("debugToggle").checked;
                const enableThreads = document.getElementById("threadsToggle").checked;
                const browserMode = Array.from(document.getElementsByName("browserMode")).find(r => r.checked)?.value;
                const biosFile = document.getElementById("inputAdvanced").files[0];
                const biosUrl = biosFile ? URL.createObjectURL(biosFile) : "";

                const div = document.createElement("div");
                const sub = document.createElement("div");
                const script = document.createElement("script");

                sub.id = "game";
                div.id = "display";

                const top = document.getElementById("top");
                if (top) top.remove();
                const box = document.getElementById("box");
                if (box) box.remove();
                const advanced = document.getElementById("advanced");
                if (advanced) advanced.remove();
                const library = document.getElementById("library");
                if (library) library.remove();

                div.appendChild(sub);
                document.body.appendChild(div);

                window.EJS_player = "#game";
                window.EJS_gameName = game.name;
                window.EJS_gameUrl = game.url;
                window.EJS_core = game.core;
                window.EJS_biosUrl = biosUrl;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_threads = enableThreads;
                if (browserMode) {
                    window.EJS_browserMode = browserMode;
                }
                window.EJS_askBeforeExit = false;
                window.EJS_onExit = () => {
                    alert("The emulator has exited.");
                };

                script.src = "data/loader.js";
                document.body.appendChild(script);
            }

            let libraryGames = [];

            async function loadGamesLibrary() {
                const listEl = document.getElementById("libraryList");
                const countEl = document.getElementById("libraryCount");
                try {
                    const res = await fetch("games.json");
                    if (res.ok) {
                        libraryGames = await res.json();
                    }
                } catch (e) {
                    console.warn("Could not load games.json", e);
                }
                renderLibrary(libraryGames);
            }

            function renderLibrary(games) {
                const listEl = document.getElementById("libraryList");
                const countEl = document.getElementById("libraryCount");
                if (!listEl) return;
                listEl.innerHTML = "";
                if (countEl) countEl.textContent = `(${games.length})`;

                if (!games || games.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "libraryEmpty";
                    empty.textContent = "No games found in games.json";
                    listEl.appendChild(empty);
                    return;
                }

                games.forEach((game) => {
                    const item = document.createElement("div");
                    item.className = "libraryItem";

                    const info = document.createElement("div");
                    info.className = "libraryItemText";

                    const name = document.createElement("span");
                    name.className = "libraryItemName";
                    name.textContent = game.name;

                    const sys = document.createElement("span");
                    sys.className = "libraryItemSystem";
                    sys.textContent = `${game.system || game.core.toUpperCase()} · ${game.url}`;

                    info.appendChild(name);
                    info.appendChild(sys);

                    const btn = document.createElement("button");
                    btn.className = "libraryPlayBtn";
                    btn.textContent = "Play";
                    btn.onclick = () => launchLibraryGame(game);

                    item.appendChild(info);
                    item.appendChild(btn);
                    listEl.appendChild(item);
                });
            }

            const searchInput = document.getElementById("librarySearch");
            if (searchInput) {
                searchInput.oninput = (e) => {
                    const q = e.target.value.toLowerCase().trim();
                    const filtered = libraryGames.filter(g =>
                        g.name.toLowerCase().includes(q) ||
                        (g.system && g.system.toLowerCase().includes(q)) ||
                        g.core.toLowerCase().includes(q) ||
                        (g.url && g.url.toLowerCase().includes(q))
                    );
                    renderLibrary(filtered);
                };
            }

            loadGamesLibrary();

            const tabLibrary = document.getElementById("tabLibrary");
            const tabUpload = document.getElementById("tabUpload");
            const tabAdvanced = document.getElementById("tabAdvanced");
            const libraryEl = document.getElementById("library");
            const boxEl = document.getElementById("box");
            const advancedEl = document.getElementById("advanced");

            function switchTab(target) {
                [tabLibrary, tabUpload, tabAdvanced].forEach(t => t?.classList.remove("active"));
                if (target === "library") {
                    tabLibrary?.classList.add("active");
                    if (libraryEl) libraryEl.style.display = "block";
                    if (boxEl) boxEl.style.display = "none";
                    if (advancedEl) advancedEl.style.display = "none";
                } else if (target === "upload") {
                    tabUpload?.classList.add("active");
                    if (libraryEl) libraryEl.style.display = "none";
                    if (boxEl) boxEl.style.display = "flex";
                    if (advancedEl) advancedEl.style.display = "none";
                } else if (target === "advanced") {
                    tabAdvanced?.classList.add("active");
                    if (libraryEl) libraryEl.style.display = "none";
                    if (boxEl) boxEl.style.display = "none";
                    if (advancedEl) advancedEl.style.display = "block";
                }
            }

            if (tabLibrary) tabLibrary.onclick = () => switchTab("library");
            if (tabUpload) tabUpload.onclick = () => switchTab("upload");
            if (tabAdvanced) tabAdvanced.onclick = () => switchTab("advanced");

            window.addEventListener("dragover", (e) => {
                e.preventDefault();
                switchTab("upload");
            });
            
            input.onchange = async () => {
                run(true);
            }
            
            box.ondragover = () => box.setAttribute("drag", true);
            box.ondragleave = () => box.removeAttribute("drag");
        </script>
    </body>
</html>
